name: Fetch Nifty 50 & Sensex news

on:
  schedule:
    # Market hours (Mon-Fri 9:00-16:00 IST = 03:30-10:30 UTC): every 5 minutes
    - cron: "2-59/5 3-10 * * 1-5"
    # Rest of the time: every 15 minutes
    - cron: "7-59/15 0-2,11-23 * * 1-5"
    - cron: "7-59/15 * * * 0,6"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect headlines
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}         # optional: phone push alerts
          ALERT_SYMBOLS: ${{ vars.ALERT_SYMBOLS }}      # optional: e.g. TCS,TATASTEEL,ADANIENT
        run: python fetch_news.py

      - name: Save updated news.json
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "news: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
